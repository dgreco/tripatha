#
# A pod that mounts Accumulo's shared volume and waits, so `kubectl cp` can put Spark and the tools on it
# (see README.md, "Run on Kubernetes without a Spark image"). Delete it once they are in place.
# Render with envsubst: NAMESPACE, DATA_PVC, DATA_PATH, as for spark-standalone.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: tripatha-stage
  namespace: ${NAMESPACE}
  labels: {app: tripatha, tripatha-role: stage}
spec:
  restartPolicy: Never
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: ${DATA_PVC}}
  containers:
    - name: stage
      image: eclipse-temurin:25-jre
      command: [bash, -c, "mkdir -p ${DATA_PATH}/tripatha-tools && sleep 3600"]
      volumeMounts:
        - {name: data, mountPath: "${DATA_PATH}"}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 512Mi}
